[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leet-together"
version = "0.1.0"
description = "Shared LeetCode progress tracking for a study group: a GitHub Action turns everyone's public solves into a README leaderboard."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["leetcode", "leaderboard", "github-actions"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]

# The Action runs on the Python standard library alone; these are for local
# development only and never reach the workflow.
[project.optional-dependencies]
dev = [
  "pytest>=7",
  "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# scripts/ is a directory of plain modules, not a package; this makes
# `import board` etc. resolve the same way scripts/update.py sees them.
pythonpath = ["scripts"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# Bug-catching rules only; the hand-tuned codebase keeps its own voice.
select = ["F", "E9"]