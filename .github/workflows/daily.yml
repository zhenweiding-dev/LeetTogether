name: Daily fetch

on:
  schedule:
    # GitHub cron runs on UTC and can be delayed by up to an hour at peak.
    # Times below are converted for California (PDT = UTC-7, PST = UTC-8).
    - cron: "0 19 * * *"   # ~12:00 PDT, so the board is not stale all day
    - cron: "50 6 * * *"   # ~23:50 PDT, catches the tail of the local day
  workflow_dispatch:        # or trigger it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch and update the board
        run: python3 scripts/update.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data README.md
          if git diff --cached --quiet; then
            echo "No changes, skipping commit"
          else
            git commit -m "chore: progress snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
